global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  # Attached to every series leaving Prometheus and to every alert, so a
  # Telegram message says which server it is about. Set SERVER_NAME in .env.
  external_labels:
    server: ${SERVER_NAME}

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: whm
    static_configs:
      - targets: ["127.0.0.1:9877"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
